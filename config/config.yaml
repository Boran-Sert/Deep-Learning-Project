project:
  name: "Time Series Anomaly Detection"
  version: "1.0.0"

paths:
  data_dir: "data"
  raw_data_dir: "data/raw"
  skab_valve1: "data/raw/SKAB-master/data/valve1"
  skab_valve2: "data/raw/SKAB-master/data/valve2"
  batadal_dataset: "data/raw/BATADAL_dataset04.csv"
  artifacts_dir: "artifacts"
  logs_dir: "logs"

experiment:
  random_seeds: [42, 123, 2026, 7, 999]
  k_folds: 5

deep_learning:
  batch_size: 32
  epochs: 50
  patience: 5

automata:
  window_size: 5  # Default, will be tuned in param search
  alphabet_size: 5 # Default, will be tuned in param search
