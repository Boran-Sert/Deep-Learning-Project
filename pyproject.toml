[project]
name = "deep-learning-project"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Windows"
venvPath = "."
venv = "venv"
extraPaths = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
